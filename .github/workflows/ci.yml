name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # pnpm/setup supersedes pnpm/action-setup for pnpm 11+: it fetches the
      # self-contained pnpm binary and installs Node in the same step, so no
      # actions/setup-node is needed. The pnpm version is deliberately not
      # pinned here — it is read from `packageManager` in package.json, so
      # there is exactly one source of truth. `pnpm install` runs automatically
      # (frozen-lockfile in CI).
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      # The publish workflow runs `jsr publish` without `--allow-slow-types`, so an
      # un-annotated export would only surface at release time. Catch it on the PR.
      # Serialized: each `npx jsr` fetches the same Deno binary into one shared npx
      # cache, and parallel invocations race on the partial download (ENOENT on rename).
      - name: JSR slow-types check
        run: pnpm --workspace-concurrency=1 --filter './packages/*' --filter '!ork' exec npx jsr publish --dry-run --allow-dirty

      # Includes the PostgreSQL Testcontainers suites; Docker is preinstalled
      # on GitHub's ubuntu runners.
      - name: Test
        run: pnpm -r test

      - name: CLI Help
        run: node packages/cli/dist/bin.js --help

      # `ork generate` typechecks its own emitted client and exits nonzero on
      # any type error, so generating both fixtures here IS the dual-dialect
      # `tsc --strict` gate for generated clients.
      # PostgreSQL config validation requires a datasource URL even to generate;
      # any syntactically valid URL works for codegen alone.
      - name: CLI Generate (dual-dialect typecheck gate)
        run: |
          cd examples/vite
          node ../../packages/cli/dist/bin.js generate
          cd ../basic
          DATABASE_URL="postgresql://user:pass@localhost:5432/db" node ../../packages/cli/dist/bin.js generate
