name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      # Includes the PostgreSQL Testcontainers suites; Docker is preinstalled
      # on GitHub's ubuntu runners.
      - name: Test
        run: pnpm -r test

      - name: CLI Help
        run: node packages/cli/dist/bin.js --help

      - name: CLI Generate (Vite demo)
        run: |
          cd examples/vite
          node ../../packages/cli/dist/bin.js generate
